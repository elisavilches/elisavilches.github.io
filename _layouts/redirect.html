<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ page.title }}</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="{{ site.url }}{{ page.redirect_to }}">
<meta http-equiv="refresh" content="0; url={{ page.redirect_to }}">
<script>location.replace({{ page.redirect_to | jsonify }} + location.hash);</script>
</head>
<body>
<p>This page has moved: <a href="{{ page.redirect_to }}">{{ site.url }}{{ page.redirect_to }}</a></p>
</body>
</html>
