
exclude:
  - "/vendor/"
  - "Gemfile"
  - "Gemfile.lock"
  - "README.md"
  - "CLAUDE.md"
  - "LICENSE.md"
  - "*.gemspec"
  - "multilingual.txt"
  - "screenshots/"
  - "form-service/"

keep_files:
  - "CNAME"
  - ".git"
  - ".gitignore"


# Site settings
title: Sworn translator (English–Spanish) - Elisa Vílchez
shorttitle: Sworn translator (English–Spanish) - Elisa Vílchez
subtitle: "Sworn Translator"
url: "https://elisavilchez.com" # base hostname (used for canonical, hreflang, sitemap)
#baseurl: "/the/subpath/of/your/site" # Set this value to "" if you want your site to be root
baseurl: ""
cover: "assets/cover.png"
logo: "assets/logo.png"

# Build settings
markdown: kramdown

# Google analytics
# ga_tracking_id: "UA-XXXX-1"

# Category descriptions (for archive pages)
descriptions:
  - cat: jekyll
    desc: "Posts describing Jekyll setup techniques."

  - cat: dummy
    desc: "Just some placeholder posts, lorem ipsum and the rest."

languages: [ 'en', 'es', 'fr', 'ca' ]
lang: 'es'

defaults:
  - scope:
      path: ''
    values:
      lang: en
      description: ''
  - scope:
      path: 'fr'
    values:
      lang: fr
      description: ''
  - scope:
      path: 'ca'
    values:
      lang: ca
  - scope:
      path: 'es'
    values:
      lang: es

# Servicio del formulario de presupuesto (form-service/, Cloud Run, proyecto elisavilchez-web).
quote_endpoint: "https://quote-form-472931935787.europe-west1.run.app/quote"
