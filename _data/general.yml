seo_description:
  en: "Sworn translations English–Spanish by a MAEC-appointed sworn translator, accepted by Spanish consulates and authorities. Visa documents: FBI and ACRO background checks, birth and marriage certificates, bank statements. Digital or paper delivery. Free quote."
  es: "Traducciones juradas de inglés a español por traductora jurada nombrada por el MAEC, válidas ante consulados y administraciones. Documentos para visados: antecedentes penales del FBI, partidas de nacimiento, extractos bancarios. Firma digital o papel."
  fr: "Traductions assermentées anglais-espagnol par une traductrice jurée nommée par le ministère espagnol des Affaires étrangères (MAEC). Documents pour visas, état civil, casiers judiciaires. Devis gratuit."
  ca: "Traduccions jurades d'anglès a castellà per una traductora jurada nomenada pel MAEC, vàlides davant consolats i administracions. Documents per a visats, antecedents penals, partides de naixement. Pressupost gratuït."

