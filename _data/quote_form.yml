# Textos del formulario de presupuesto (_includes/quote-form.html), por idioma.
en:
  intro: "Tell me what you need and attach your documents. I'll reply by email with a fixed quote and a delivery date."
  name: "Your name"
  email: "Your email"
  visa: "What is it for?"
  visa_options: ["Non-lucrative visa", "Digital nomad visa", "Student visa", "NALCAP / language assistant", "Family reunification", "Other procedure"]
  choose: "Choose one"
  consulate: "Consulate or office"
  consulate_hint: "For example: Los Angeles, London, BLS New York"
  documents: "Which documents?"
  documents_hint: "For example: FBI background check with apostille, birth certificate"
  files: "Attach your documents"
  files_hint: "PDF, photos or Word. Up to 20 files and 15 MB in total. A clear scan or photo of every page is enough."
  deadline: "When do you need it?"
  delivery: "Delivery"
  delivery_options: ["Digital (qualified e-signature)", "Paper (original stamp and signature)", "Not sure"]
  message: "Anything else?"
  optional: "optional"
  source: "How did you hear about me?"
  source_options: ["Google", "Recommended by someone I know", "A forum or group (Reddit, Facebook…)", "A consulate, agency or lawyer", "I’m already a client", "Other"]
  privacy: "I'll only use your details and documents to prepare your quote and translation. More in the"
  privacy_link: "privacy policy"
  submit: "Send request"
  sending: "Sending…"
  ok_title: "Request received"
  ok_text: "Thank you. I've sent a confirmation to your email. I'll reply with a quote and a delivery date."
  errors:
    email_invalid: "Please check your email address."
    name_required: "Please tell me your name."
    too_fast: "Please try again in a few seconds."
    file_type: "One of the files has a format I can't accept. Please use PDF, JPG, PNG, HEIC or Word."
    too_large: "The files are too large (15 MB in total). Send the rest by email after this request."
    too_many_files: "Please attach 20 files at most. Send the rest by email after this request."
    rate_limited: "Too many requests from your connection. Please try again later or email me."
    generic: "Something went wrong and your request was not sent. Please email your documents to"
